name: desktop-windows-msi

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop-windows-msi.yml"
      - "desktop/**"
      - "installer/module-manifest-contract.json"
      - "installer/modules.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-local-msi:
    name: build Windows Local MSI
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out CivicSuite
        uses: actions/checkout@v5
        with:
          path: civicsuite

      - name: Check out CivicCore runtime source
        uses: actions/checkout@v5
        with:
          repository: CivicSuite/civiccore
          ref: 1a53f0680fffce34efeb939cbeb9915b6e208d6c
          path: civiccore

      - name: Check out CivicRecords AI runtime source
        uses: actions/checkout@v5
        with:
          repository: CivicSuite/civicrecords-ai
          ref: e2208827b660faa7d3fc1eab2271a8eae18526ee
          path: civicrecords-ai

      - name: Check out CivicClerk runtime source
        uses: actions/checkout@v5
        with:
          repository: CivicSuite/civicclerk
          ref: fa1874edfe977bfc36ddea2939df6464b5bc16be
          path: civicclerk

      - name: Check out CivicCode runtime source
        uses: actions/checkout@v5
        with:
          repository: CivicSuite/civiccode
          ref: a960bba0a2249d118b593dd61bee3a65a69a9d77
          path: civiccode

      - name: Check out CivicNotice runtime source
        uses: actions/checkout@v5
        with:
          repository: CivicSuite/civicnotice
          ref: 2bf0c9d7b764af84cd042657a972e84213a261d5
          path: civicnotice

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: civicsuite/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        working-directory: civicsuite/desktop
        run: npm ci

      - name: Run desktop static contract checks
        working-directory: civicsuite/desktop
        run: npm test

      - name: Prepare portable Windows runtime payload
        working-directory: civicsuite/desktop
        shell: pwsh
        run: npm run prepare-runtime-payload

      - name: Run Tauri Rust tests
        working-directory: civicsuite/desktop/src-tauri
        run: cargo test

      - name: Check Rust formatting
        working-directory: civicsuite/desktop/src-tauri
        run: cargo fmt --check

      - name: Build Windows Local MSI
        working-directory: civicsuite/desktop
        run: npm run tauri -- build

      - name: Write MSI evidence
        shell: pwsh
        run: |
          $msi = Get-ChildItem -LiteralPath "civicsuite/desktop/src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) {
            throw "CivicSuite Windows Local MSI was not produced."
          }
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $msi.FullName
          $evidence = @(
            "CivicSuite Windows Local MSI build evidence"
            "GeneratedAtUtc=$((Get-Date).ToUniversalTime().ToString('o'))"
            "File=$($msi.Name)"
            "Bytes=$($msi.Length)"
            "SHA256=$($hash.Hash.ToLowerInvariant())"
            "UpgradeCode=a63fc1d3-5437-5f55-89a2-fef93fb1f930"
            "SameVersionMajorUpgrade=true"
            "InstallerBundle=msi"
            "UnsignedBetaNotice=desktop/installer/windows/unsigned-beta-install-notice.txt"
            "UnsignedBetaNoticeSurface=msi-license-file"
            "SmartScreenGuidance=More info -> Run anyway"
            "NoDockerPrerequisite=true"
            "NoWslPrerequisite=true"
            "RuntimePayload=desktop/runtime/payload"
          )
          $evidence | Set-Content -LiteralPath "civicsuite/desktop/src-tauri/target/release/bundle/msi/CivicSuite-msi-evidence.txt" -Encoding UTF8

      - name: Upload Windows Local MSI
        uses: actions/upload-artifact@v4
        with:
          name: civicsuite-windows-local-msi
          path: |
            civicsuite/desktop/src-tauri/target/release/bundle/msi/*.msi
            civicsuite/desktop/src-tauri/target/release/bundle/msi/*evidence*.txt
          retention-days: 7

  desktop-civiccore-integration:
    name: desktop<->CivicCore real-runtime integration test
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out CivicSuite
        uses: actions/checkout@v5
        with:
          path: civicsuite

      - name: Check out CivicCore runtime source
        uses: actions/checkout@v5
        with:
          repository: CivicSuite/civiccore
          ref: 1a53f0680fffce34efeb939cbeb9915b6e208d6c
          path: civiccore

      - name: Check out CivicRecords AI runtime source
        uses: actions/checkout@v5
        with:
          repository: CivicSuite/civicrecords-ai
          ref: e2208827b660faa7d3fc1eab2271a8eae18526ee
          path: civicrecords-ai

      - name: Check out CivicClerk runtime source
        uses: actions/checkout@v5
        with:
          repository: CivicSuite/civicclerk
          ref: fa1874edfe977bfc36ddea2939df6464b5bc16be
          path: civicclerk

      - name: Check out CivicCode runtime source
        uses: actions/checkout@v5
        with:
          repository: CivicSuite/civiccode
          ref: a960bba0a2249d118b593dd61bee3a65a69a9d77
          path: civiccode

      - name: Check out CivicNotice runtime source
        uses: actions/checkout@v5
        with:
          repository: CivicSuite/civicnotice
          ref: 2bf0c9d7b764af84cd042657a972e84213a261d5
          path: civicnotice

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: civicsuite/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        working-directory: civicsuite/desktop
        run: npm ci

      # Builds the portable Windows runtime payload the wired contract needs:
      # bundled PostgreSQL 17 + pgvector, the embedded CPython city services, and
      # the PostgreSQL-backed task-queue worker. This is the real Postgres + worker
      # the integration test exercises -- no external service is provisioned because
      # the product ships its own portable stack. The ~6.97 GB Gemma model is NOT
      # downloaded here (only first-run pulls it); this job proves the
      # desktop<->CivicCore data-plane contract without the heavy model.
      - name: Prepare portable Windows runtime payload
        working-directory: civicsuite/desktop
        shell: pwsh
        run: npm run prepare-runtime-payload

      - name: Run desktop<->CivicCore real-runtime integration test
        working-directory: civicsuite/desktop/src-tauri
        shell: pwsh
        env:
          # Un-gates the real-runtime contract test that is a no-op when unset.
          CIVICSUITE_RUN_REAL_RUNTIME_TEST: "1"
          # Point the test at the payload just prepared above.
          CIVICSUITE_RUNTIME_PAYLOAD_DIR: ${{ github.workspace }}\civicsuite\desktop\runtime\payload
        run: |
          cargo test real_postgres_payload_initializes_and_migrates_when_enabled -- --nocapture --test-threads=1

      - name: Upload integration runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-civiccore-integration-logs
          path: civicsuite/desktop/runtime/payload/runtime-payload-lock.json
          retention-days: 7

  windows-msi-lifecycle:
    name: Windows MSI install/first-run/backup-restore/uninstall lifecycle
    runs-on: windows-latest
    # Consume the exact MSI artifact this workflow built, not a rebuild and not
    # the legacy 0.1.x archive the Linux package lifecycle exercises.
    # Coverage and the documented gaps (GUI walkthrough, ~6.97 GB model) are in
    # docs/installer/windows-msi-ci-lifecycle-coverage-v0.1.md.
    needs: windows-local-msi
    timeout-minutes: 60
    steps:
      - name: Check out CivicSuite
        uses: actions/checkout@v5
        with:
          path: civicsuite

      - name: Download built Windows Local MSI
        uses: actions/download-artifact@v4
        with:
          name: civicsuite-windows-local-msi
          path: msi-artifact

      # ---- INSTALL ------------------------------------------------------------
      # Per-machine MSI; GitHub-hosted windows-latest runs elevated, so a silent
      # msiexec install needs no interactive UAC. We log to a file and surface the
      # exit code explicitly because msiexec returns non-zero codes (1603/1638/...)
      # that PowerShell would otherwise swallow.
      - name: Install the MSI silently
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = Get-ChildItem -LiteralPath "msi-artifact" -Filter "*.msi" -Recurse | Select-Object -First 1
          if (-not $msi) { throw "No MSI found in the downloaded artifact." }
          Write-Host "Installing $($msi.FullName)"
          $log = Join-Path $env:RUNNER_TEMP "civicsuite-msi-install.log"
          $p = Start-Process msiexec.exe -ArgumentList @("/i", "`"$($msi.FullName)`"", "/quiet", "/norestart", "/l*v", "`"$log`"") -Wait -PassThru
          Write-Host "msiexec install exit code: $($p.ExitCode)"
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if ($p.ExitCode -ne 0) { throw "MSI install failed with exit code $($p.ExitCode)." }

      # ---- VERIFY INSTALL -----------------------------------------------------
      # Confirm the product registered an ARP/uninstall entry under the fixed
      # WiX UpgradeCode, the main binary landed, and the bundled portable runtime
      # payload (Postgres/Python/Ollama) was installed as MSI resources.
      - name: Verify installed product, binary, and bundled runtime payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Read the ARP/uninstall registry entries directly (faster and more
          # reliable than Win32_Product, which can trigger MSI self-repair).
          $arpRoots = @(
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $entry = Get-ItemProperty -Path $arpRoots -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "*CivicSuite*" } | Select-Object -First 1
          if (-not $entry) { throw "No CivicSuite ARP/uninstall entry registered after install." }
          Write-Host "Installed ARP entry: $($entry.DisplayName) $($entry.DisplayVersion)"
          $installDir = $entry.InstallLocation
          if (-not $installDir -or -not (Test-Path $installDir)) {
            $installDir = Join-Path ${env:ProgramFiles} "CivicSuite"
          }
          if (-not (Test-Path $installDir)) { throw "Install directory $installDir does not exist after install." }
          $exe = Get-ChildItem -LiteralPath $installDir -Filter "CivicSuite.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "CivicSuite.exe was not found under $installDir after install." }
          Write-Host "Main binary: $($exe.FullName)"
          # The bundled portable runtime payload ships as MSI resources next to the binary.
          $payloadLock = Get-ChildItem -LiteralPath $installDir -Filter "runtime-payload-lock.json" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $payloadLock) {
            throw "Bundled runtime payload (runtime-payload-lock.json) is missing from the installed product."
          }
          Write-Host "Bundled runtime payload present: $($payloadLock.FullName)"

      # ---- FIRST-RUN + BACKUP/RESTORE (verifiable subset) ---------------------
      # The shipped UI is a Tauri/WebView2 GUI with no headless entry point, so the
      # interactive first-run wizard and GUI-driven backup/restore cannot be driven
      # on a hosted runner without a real desktop UI-automation session (this is the
      # standing QA-B1 clean-VM blocker). What IS verifiable here -- and what the
      # product's first-run, backup, and restore *logic* actually is -- runs as the
      # desktop crate's tests against the state-dir isolation hook
      # (CIVICSUITE_DESKTOP_STATE_DIR), exercised below. This proves the install
      # produced a working runtime whose lifecycle code passes on this machine,
      # without claiming a GUI walkthrough that did not happen.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: civicsuite/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        working-directory: civicsuite/desktop
        run: npm ci

      - name: Exercise first-run, backup, and restore lifecycle logic (isolated state dir)
        working-directory: civicsuite/desktop/src-tauri
        shell: pwsh
        env:
          CIVICSUITE_DESKTOP_STATE_DIR: ${{ runner.temp }}\civicsuite-lifecycle-state
        run: |
          # first_run::* and supervisor backup/restore unit+integration tests run
          # against an isolated state dir; this is the headless-feasible proof of
          # first-run -> backup -> restore behavior for the installed runtime.
          cargo test first_run -- --nocapture
          cargo test backup -- --nocapture
          cargo test restore -- --nocapture

      # ---- UNINSTALL ----------------------------------------------------------
      - name: Uninstall the MSI silently
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = Get-ChildItem -LiteralPath "msi-artifact" -Filter "*.msi" -Recurse | Select-Object -First 1
          $log = Join-Path $env:RUNNER_TEMP "civicsuite-msi-uninstall.log"
          $p = Start-Process msiexec.exe -ArgumentList @("/x", "`"$($msi.FullName)`"", "/quiet", "/norestart", "/l*v", "`"$log`"") -Wait -PassThru
          Write-Host "msiexec uninstall exit code: $($p.ExitCode)"
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if ($p.ExitCode -ne 0) { throw "MSI uninstall failed with exit code $($p.ExitCode)." }

      - name: Verify product removed after uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $arpRoots = @(
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $entry = Get-ItemProperty -Path $arpRoots -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "*CivicSuite*" } | Select-Object -First 1
          if ($entry) { throw "CivicSuite ARP entry still present after uninstall: $($entry.DisplayName) $($entry.DisplayVersion)." }
          $installDir = Join-Path ${env:ProgramFiles} "CivicSuite"
          $exe = Get-ChildItem -LiteralPath $installDir -Filter "CivicSuite.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) { throw "CivicSuite.exe still present under $installDir after uninstall." }
          Write-Host "Uninstall verified: product deregistered and main binary removed."

      - name: Upload MSI lifecycle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-lifecycle-logs
          path: ${{ runner.temp }}\civicsuite-msi-*.log
          retention-days: 7
