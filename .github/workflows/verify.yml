name: verify

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/verify.yml"
      - "docs/**"
      - "installer/**"
      - "scripts/**"
      - "tests/**"
      - "*.md"
      - "*.txt"
      - "*.json"
      - "*.toml"
      - "CLAUDE.md"
      - "PROJECT_CONTROL_PLANE.md"
      - "ACTIVE_WORK_QUEUE.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Verify documentation
        run: bash scripts/verify-docs.sh

      - name: Verify no committed secret patterns
        run: python scripts/verify-secret-scan.py

      - name: Verify stage evidence
        run: python scripts/policy/check_stage_evidence.py

      - name: Install Node dependencies
        run: npm ci

      - name: Install browser for docs landing page check
        run: npx playwright install --with-deps chromium

      - name: Verify docs landing page in browser
        run: npm run verify:browser

      - name: Install deployment verifier dependency
        run: python -m pip install pyyaml

      - name: Verify deployment profile statically
        run: python scripts/verify-deployment-profile.py --static-only

      - name: Verify installer plan
        run: python scripts/verify-installer-plan.py

      - name: Verify suite state against GitHub releases
        env:
          GH_TOKEN: ${{ secrets.CIVICSUITE_GITHUB_TOKEN || secrets.CIVICSUITE_GH_TOKEN || secrets.GH_TOKEN || github.token }}
        run: python scripts/verify-suite-state.py --remote-only
