name: model-pin-check

# Non-blocking integrity check for the pinned Gemma model: confirms the pinned
# Hugging Face resolve URL is reachable and its size matches the manifest. Kept
# OUT of the required `verify` gate on purpose so HF uptime never blocks a merge.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1" # weekly, Monday 12:00 UTC
  pull_request:
    paths:
      - "desktop/runtime/gemma4-model.json"
      - ".github/workflows/model-pin-check.yml"

permissions:
  contents: read

jobs:
  model-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: HEAD the pinned model URL and compare size to the manifest
        run: |
          set -euo pipefail
          manifest="desktop/runtime/gemma4-model.json"
          url="$(jq -r '.model.resolve_url' "$manifest")"
          expected="$(jq -r '.model.artifact.size_bytes' "$manifest")"
          echo "Pinned URL : $url"
          echo "Manifest   : $expected bytes"
          # -I HEAD, -L follow HF -> CDN redirects; take the LAST Content-Length seen.
          len="$(curl -sIL --retry 3 --max-time 120 "$url" | tr -d '\r' \
            | awk 'tolower($1)=="content-length:"{v=$2} END{print v}')"
          echo "Live HEAD  : ${len:-<none>} bytes"
          test -n "${len:-}" || { echo "FAIL: no Content-Length from $url"; exit 1; }
          test "$len" = "$expected" || { echo "FAIL: size $len != manifest $expected"; exit 1; }
          echo "PASS: pinned model URL reachable and size matches the manifest."
