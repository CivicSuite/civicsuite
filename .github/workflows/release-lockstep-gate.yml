name: release-lockstep-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  release-lockstep-gate:
    if: contains(github.event.pull_request.labels.*.name, 'release-tag')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release truth artifacts move together
        run: python scripts/verify-release-lockstep.py
