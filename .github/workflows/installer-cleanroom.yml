name: installer-cleanroom

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/installer-cleanroom.yml"
      - "docs/installer/**"
      - "installer/**"
      - "scripts/plan-installer.py"
      - "scripts/run-clerk-core-installer.py"
      - "scripts/run-installer-package-cleanroom.py"
      - "scripts/verify-installer-plan.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/installer-cleanroom.yml"
      - "docs/installer/**"
      - "installer/**"
      - "scripts/plan-installer.py"
      - "scripts/run-clerk-core-installer.py"
      - "scripts/run-installer-package-cleanroom.py"
      - "scripts/verify-installer-plan.py"

permissions:
  contents: read

concurrency:
  group: installer-cleanroom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-readiness-plan:
    name: ${{ matrix.platform }} archive readiness and plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            profile: clerk-core
            os: windows-latest
            archive: installer/dist/CivicSuite-clerk-core-windows-0.1.0.zip
            installer_version: 0.1.0
          - platform: macos
            profile: clerk-core
            os: [self-hosted, linux, x64]
            archive: installer/dist/CivicSuite-clerk-core-macos-0.1.0.tar.gz
            installer_version: 0.1.0
          - platform: linux
            profile: clerk-core
            os: [self-hosted, linux, x64]
            archive: installer/dist/CivicSuite-clerk-core-linux-0.1.0.tar.gz
            installer_version: 0.1.0
          - platform: windows
            profile: city-core
            os: windows-latest
            archive: installer/dist/CivicSuite-city-core-windows-0.1.0.zip
            installer_version: 0.1.0
          - platform: macos
            profile: city-core
            os: [self-hosted, linux, x64]
            archive: installer/dist/CivicSuite-city-core-macos-0.1.0.tar.gz
            installer_version: 0.1.0
          - platform: linux
            profile: city-core
            os: [self-hosted, linux, x64]
            archive: installer/dist/CivicSuite-city-core-linux-0.1.2.tar.gz
            installer_version: 0.1.2
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check out CivicRecords AI bundle source
        uses: actions/checkout@v5
        with:
          repository: CivicSuite/civicrecords-ai
          ref: master
          path: modules/civicrecords-ai

      - name: Check out CivicClerk bundle source
        uses: actions/checkout@v5
        with:
          repository: CivicSuite/civicclerk
          ref: main
          path: modules/civicclerk

      - name: Check out CivicCode bundle source
        uses: actions/checkout@v5
        with:
          repository: CivicSuite/civiccode
          ref: main
          path: modules/civiccode

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate release artifacts
        run: python scripts/plan-installer.py --profile "${{ matrix.profile }}" --generate-release-artifacts --installer-version "${{ matrix.installer_version }}"

      - name: Run extracted package readiness and plan
        run: python scripts/run-installer-package-cleanroom.py --archive "${{ matrix.archive }}" --platform "${{ matrix.platform }}" --skip-install --run-id "ci-${{ matrix.profile }}-${{ matrix.platform }}-package-plan"

      - name: Upload readiness and plan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.profile }}-${{ matrix.platform }}-package-plan
          path: installer/reports/ci-${{ matrix.profile }}-${{ matrix.platform }}-package-plan/
          retention-days: 7

  linux-package-lifecycle:
    name: linux archive full lifecycle
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: clerk-core
            archive: installer/dist/CivicSuite-clerk-core-linux-0.1.0.tar.gz
            run_id: ci-linux-package-lifecycle
            installer_version: 0.1.0
          - profile: city-core
            archive: installer/dist/CivicSuite-city-core-linux-0.1.2.tar.gz
            run_id: ci-city-core-linux-package-lifecycle
            installer_version: 0.1.2
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check out CivicRecords AI bundle source
        uses: actions/checkout@v5
        with:
          repository: CivicSuite/civicrecords-ai
          ref: master
          path: modules/civicrecords-ai

      - name: Check out CivicClerk bundle source
        uses: actions/checkout@v5
        with:
          repository: CivicSuite/civicclerk
          ref: main
          path: modules/civicclerk

      - name: Check out CivicCode bundle source
        uses: actions/checkout@v5
        with:
          repository: CivicSuite/civiccode
          ref: main
          path: modules/civiccode

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate release artifacts
        run: python scripts/plan-installer.py --profile "${{ matrix.profile }}" --generate-release-artifacts --installer-version "${{ matrix.installer_version }}"

      - name: Run extracted Linux package install, repair, verify, workflow proof, backup, restore, and uninstall
        run: python scripts/run-installer-package-cleanroom.py --archive "${{ matrix.archive }}" --platform linux --run-id "${{ matrix.run_id }}" --staff-mode bearer --workflow-proof

      - name: Upload Linux lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.profile }}-linux-package-lifecycle
          path: installer/reports/${{ matrix.run_id }}/
          retention-days: 7
