name: installer-cleanroom

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
  pull_request:
    paths:
      - ".github/workflows/installer-cleanroom.yml"
      - "docs/installer/**"
      - "installer/**"
      - "scripts/plan-installer.py"
      - "scripts/run-clerk-core-installer.py"
      - "scripts/run-installer-package-cleanroom.py"
      - "scripts/verify-installer-plan.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/installer-cleanroom.yml"
      - "docs/installer/**"
      - "installer/**"
      - "scripts/plan-installer.py"
      - "scripts/run-clerk-core-installer.py"
      - "scripts/run-installer-package-cleanroom.py"
      - "scripts/verify-installer-plan.py"

permissions:
  contents: read

jobs:
  package-readiness-plan:
    name: ${{ matrix.platform }} archive readiness and plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            archive: installer/dist/CivicSuite-clerk-core-windows-0.1.0.zip
          - platform: macos
            os: [self-hosted, linux, x64]
            archive: installer/dist/CivicSuite-clerk-core-macos-0.1.0.tar.gz
          - platform: linux
            os: [self-hosted, linux, x64]
            archive: installer/dist/CivicSuite-clerk-core-linux-0.1.0.tar.gz
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check out CivicRecords AI bundle source
        uses: actions/checkout@v5
        with:
          repository: CivicSuite/civicrecords-ai
          ref: master
          path: modules/civicrecords-ai

      - name: Check out CivicClerk bundle source
        uses: actions/checkout@v5
        with:
          repository: CivicSuite/civicclerk
          ref: main
          path: modules/civicclerk

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate release artifacts
        run: python scripts/plan-installer.py --profile clerk-core --generate-release-artifacts --installer-version 0.1.0

      - name: Run extracted package readiness and plan
        run: python scripts/run-installer-package-cleanroom.py --archive "${{ matrix.archive }}" --platform "${{ matrix.platform }}" --skip-install --run-id "ci-${{ matrix.platform }}-package-plan"

      - name: Upload readiness and plan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-package-plan
          path: installer/reports/ci-${{ matrix.platform }}-package-plan/

  linux-package-lifecycle:
    name: linux archive full lifecycle
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check out CivicRecords AI bundle source
        uses: actions/checkout@v5
        with:
          repository: CivicSuite/civicrecords-ai
          ref: master
          path: modules/civicrecords-ai

      - name: Check out CivicClerk bundle source
        uses: actions/checkout@v5
        with:
          repository: CivicSuite/civicclerk
          ref: main
          path: modules/civicclerk

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate release artifacts
        run: python scripts/plan-installer.py --profile clerk-core --generate-release-artifacts --installer-version 0.1.0

      - name: Run extracted Linux package install, repair, verify, and uninstall
        run: python scripts/run-installer-package-cleanroom.py --archive installer/dist/CivicSuite-clerk-core-linux-0.1.0.tar.gz --platform linux --run-id ci-linux-package-lifecycle

      - name: Upload Linux lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux-package-lifecycle
          path: installer/reports/ci-linux-package-lifecycle/
