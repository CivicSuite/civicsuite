<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">CivicSuite suite architecture</title>
  <desc id="desc">CivicSuite umbrella documentation governs CivicCore and shipping product modules: CivicRecords AI, CivicClerk, CivicCode, CivicZone, CivicAccess, CivicPlan, and CivicPermit. Each module depends on CivicCore 0.2.0. Future modules begin with CivicInspect.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #1f2328; }
    .label { font-size: 21px; font-weight: 700; }
    .small { font-size: 15px; }
    .tiny { font-size: 13px; fill: #57606a; }
    .box { rx: 18; ry: 18; stroke-width: 3; }
    .gov { fill: #e8ecff; stroke: #5865a8; }
    .core { fill: #dff6e7; stroke: #2f7a4f; }
    .ship { fill: #eef9f1; stroke: #2f7a4f; }
    .future { fill: #fff4df; stroke: #a06a20; stroke-dasharray: 9 7; }
    .line { stroke: #59636e; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 8 7; }
    .edge { font-size: 13px; fill: #59636e; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#59636e"/>
    </marker>
  </defs>

  <rect x="35" y="35" width="1130" height="750" rx="28" fill="#fbfbfa" stroke="#d0d7de"/>
  <text x="600" y="82" text-anchor="middle" class="label">CivicSuite Organization Architecture</text>
  <text x="600" y="110" text-anchor="middle" class="tiny">Governance and documentation in the umbrella repo; runtime modules ship as separate repos pinned to CivicCore.</text>

  <rect x="90" y="145" width="300" height="120" class="box gov"/>
  <text x="240" y="185" text-anchor="middle" class="label">civicsuite</text>
  <text x="240" y="215" text-anchor="middle" class="small">umbrella repo</text>
  <text x="240" y="241" text-anchor="middle" class="tiny">specs, ADRs, compatibility matrix</text>

  <rect x="450" y="145" width="300" height="120" class="box core"/>
  <text x="600" y="185" text-anchor="middle" class="label">civiccore</text>
  <text x="600" y="215" text-anchor="middle" class="small">v0.2.0 shared library</text>
  <text x="600" y="241" text-anchor="middle" class="tiny">migrations, db.Base, LLM abstraction</text>

  <rect x="80" y="345" width="210" height="100" class="box ship"/>
  <text x="185" y="378" text-anchor="middle" class="label">civicrecords-ai</text>
  <text x="185" y="405" text-anchor="middle" class="small">v1.4.0 shipping</text>
  <text x="185" y="428" text-anchor="middle" class="tiny">FOIA / public records</text>

  <rect x="350" y="345" width="210" height="100" class="box ship"/>
  <text x="455" y="378" text-anchor="middle" class="label">civicclerk</text>
  <text x="455" y="405" text-anchor="middle" class="small">v0.1.0 shipping</text>
  <text x="455" y="428" text-anchor="middle" class="tiny">meetings / agendas</text>

  <rect x="620" y="345" width="210" height="100" class="box ship"/>
  <text x="725" y="378" text-anchor="middle" class="label">civiccode</text>
  <text x="725" y="405" text-anchor="middle" class="small">v0.1.0 shipping</text>
  <text x="725" y="428" text-anchor="middle" class="tiny">municipal code</text>

  <rect x="890" y="345" width="210" height="100" class="box ship"/>
  <text x="995" y="378" text-anchor="middle" class="label">civiczone</text>
  <text x="995" y="405" text-anchor="middle" class="small">v0.1.0 shipping</text>
  <text x="995" y="428" text-anchor="middle" class="tiny">zoning / land use</text>

  <rect x="215" y="510" width="250" height="100" class="box ship"/>
  <text x="340" y="543" text-anchor="middle" class="label">civicaccess</text>
  <text x="340" y="570" text-anchor="middle" class="small">v0.1.0 shipping</text>
  <text x="340" y="593" text-anchor="middle" class="tiny">accessibility / language</text>

  <rect x="735" y="510" width="250" height="100" class="box ship"/>
  <text x="860" y="543" text-anchor="middle" class="label">civicplan</text>
  <text x="860" y="570" text-anchor="middle" class="small">v0.1.0 shipping</text>
  <text x="860" y="593" text-anchor="middle" class="tiny">plan policy support</text>

  <rect x="440" y="660" width="320" height="85" class="box ship"/>
  <text x="600" y="692" text-anchor="middle" class="label">civicpermit</text>
  <text x="600" y="718" text-anchor="middle" class="small">v0.1.0 shipping</text>
  <text x="600" y="739" text-anchor="middle" class="tiny">permit intake support</text>

  <path d="M390 205 L450 205" class="line dash"/>
  <text x="420" y="193" text-anchor="middle" class="edge">documents</text>

  <path d="M185 345 C260 290 510 285 565 265" class="line"/>
  <path d="M455 345 C500 310 560 300 590 265" class="line"/>
  <path d="M725 345 C700 310 640 300 610 265" class="line"/>
  <path d="M995 345 C925 290 710 285 635 265" class="line"/>
  <path d="M340 510 C415 430 545 330 585 265" class="line"/>
  <path d="M860 510 C800 430 655 330 615 265" class="line"/>
  <text x="600" y="315" text-anchor="middle" class="edge">all shipping modules depend on civiccore==0.2.0</text>

  <path d="M600 610 L600 660" class="line"/>
  <text x="670" y="645" class="edge">depends on civiccore==0.2.0</text>

  <rect x="820" y="665" width="260" height="75" class="box future"/>
  <text x="950" y="697" text-anchor="middle" class="label">future modules</text>
  <text x="950" y="723" text-anchor="middle" class="small">CivicInspect next planned lane</text>
</svg>
