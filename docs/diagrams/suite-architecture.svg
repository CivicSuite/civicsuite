<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">CivicSuite suite architecture</title>
  <desc id="desc">CivicSuite umbrella documentation governs CivicCore and shipping product modules: CivicRecords AI, CivicClerk, CivicCode, and CivicZone. Each module depends on CivicCore 0.2.0. Future modules begin with CivicAccess.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #1f2328; }
    .label { font-size: 22px; font-weight: 700; }
    .small { font-size: 16px; }
    .tiny { font-size: 14px; fill: #57606a; }
    .box { rx: 18; ry: 18; stroke-width: 3; }
    .gov { fill: #e8ecff; stroke: #5865a8; }
    .core { fill: #dff6e7; stroke: #2f7a4f; }
    .ship { fill: #eef9f1; stroke: #2f7a4f; }
    .future { fill: #fff4df; stroke: #a06a20; stroke-dasharray: 9 7; }
    .line { stroke: #59636e; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 8 7; }
    .edge { font-size: 13px; fill: #59636e; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#59636e"/>
    </marker>
  </defs>

  <rect x="35" y="35" width="1130" height="650" rx="28" fill="#fbfbfa" stroke="#d0d7de"/>
  <text x="600" y="82" text-anchor="middle" class="label">CivicSuite Organization Architecture</text>
  <text x="600" y="110" text-anchor="middle" class="tiny">Governance and documentation in the umbrella repo; runtime modules ship as separate repos pinned to CivicCore.</text>

  <rect x="90" y="150" width="300" height="120" class="box gov"/>
  <text x="240" y="190" text-anchor="middle" class="label">civicsuite</text>
  <text x="240" y="220" text-anchor="middle" class="small">umbrella repo</text>
  <text x="240" y="246" text-anchor="middle" class="tiny">specs, ADRs, compatibility matrix</text>

  <rect x="450" y="150" width="300" height="120" class="box core"/>
  <text x="600" y="190" text-anchor="middle" class="label">civiccore</text>
  <text x="600" y="220" text-anchor="middle" class="small">v0.2.0 shared library</text>
  <text x="600" y="246" text-anchor="middle" class="tiny">migrations, db.Base, LLM abstraction</text>

  <rect x="105" y="360" width="230" height="105" class="box ship"/>
  <text x="220" y="395" text-anchor="middle" class="label">civicrecords-ai</text>
  <text x="220" y="424" text-anchor="middle" class="small">v1.4.0 shipping</text>
  <text x="220" y="448" text-anchor="middle" class="tiny">FOIA / public records</text>

  <rect x="365" y="360" width="210" height="105" class="box ship"/>
  <text x="470" y="395" text-anchor="middle" class="label">civicclerk</text>
  <text x="470" y="424" text-anchor="middle" class="small">v0.1.0 shipping</text>
  <text x="470" y="448" text-anchor="middle" class="tiny">meetings / agendas</text>

  <rect x="625" y="360" width="210" height="105" class="box ship"/>
  <text x="730" y="395" text-anchor="middle" class="label">civiccode</text>
  <text x="730" y="424" text-anchor="middle" class="small">v0.1.0 shipping</text>
  <text x="730" y="448" text-anchor="middle" class="tiny">municipal code</text>

  <rect x="885" y="360" width="210" height="105" class="box ship"/>
  <text x="990" y="395" text-anchor="middle" class="label">civiczone</text>
  <text x="990" y="424" text-anchor="middle" class="small">v0.1.0 shipping</text>
  <text x="990" y="448" text-anchor="middle" class="tiny">zoning / land use</text>

  <rect x="450" y="555" width="300" height="85" class="box future"/>
  <text x="600" y="590" text-anchor="middle" class="label">future modules</text>
  <text x="600" y="620" text-anchor="middle" class="small">CivicAccess next planned lane</text>

  <path d="M390 210 L450 210" class="line dash"/>
  <text x="420" y="198" text-anchor="middle" class="edge">documents</text>

  <path d="M220 360 C250 310 510 300 565 270" class="line"/>
  <path d="M470 360 C500 315 560 305 590 270" class="line"/>
  <path d="M730 360 C700 315 640 305 610 270" class="line"/>
  <path d="M990 360 C935 310 710 300 635 270" class="line"/>
  <text x="600" y="327" text-anchor="middle" class="edge">all shipping modules depend on civiccore==0.2.0</text>

  <path d="M600 465 L600 555" class="line dash"/>
  <text x="678" y="516" class="edge">next module lane</text>
</svg>
