name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: sha256sum dist/* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*
            SHA256SUMS.txt
