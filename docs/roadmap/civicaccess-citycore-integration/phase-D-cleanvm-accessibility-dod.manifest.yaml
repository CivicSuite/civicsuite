# DRAFT - awaiting Scott's APPROVE before the pipeline runs. Predecessor: Phase C (6-module profile).
# Phase D: prove the 6-module city-core on a CLEAN VM per the program Definition of Done, with a
# FULL accessibility acceptance pass, then commit the evidence kit and flip release truth.
pipeline_run:
  id: "2026-06-28-civicaccess-city-core-phaseD-cleanvm-dod"
  type: evidence
  target_repo: "CivicSuite/civicsuite"
  branch: "evidence/civicaccess-citycore-dod"
  depends_on: "Phase C (city-core is 6 modules across registry/contract/gates/truth)."

  goal: >
    Earn the program Definition of Done for the 6-module city-core: a clean VM installs the suite by
    double-click, every CivicAccess workflow is exercised end-to-end through the browser on the
    installer-built stack with Postgres-persisted data, the VM reboots and data survives, and a FULL
    accessibility + export-correctness acceptance passes - all captured as a committed evidence kit.

  active_scope:
    summary: >
      Proof only. No feature code. The acceptance bar is the clean-VM evidence kit; a green CI run or
      passing tests is explicitly NOT acceptance.

  environment_note: >
    The previous Beelink tester (DESKTOP-2BR3SJR) + its every-2-min runner were DECOMMISSIONED on
    2026-06-28, so its control channel no longer exists. Phase D must stand up a fresh clean-VM
    harness - either a new Windows Sandbox run (the QA-B1 pattern: >=20 GB RAM .wsb, mapped MSI,
    fire-and-forget invoke + external poll for long ops) or a pristine-snapshot VM - before it can run.

  allowed_paths:
    - "docs/qa/**"
    - "docs/evidence/**"
    - "docs/installer/**"
    - "STATUS.md"
    - "CHANGELOG.md"
    - ".agent-runs/**"

  dod_workflow_surfaces:   # all 14 must be exercised through the browser on the installed stack, Postgres-persisted
    - "POST /api/v1/civicaccess/review (WCAG review) -> persisted review record"
    - "GET /reviews ; GET /reviews/{id}"
    - "POST /reviews/{id}/records-export (records-ready export)"
    - "GET /integration-contracts"
    - "POST forms (accessible form plan)"
    - "POST publishing-workflow"
    - "POST plain-language"
    - "POST language-variant (multilingual)"
    - "POST ada-title-ii"
    - "POST tagged-pdf"
    - "POST export"
    - "/civicaccess (public surface)"
    - "/civicaccess/staff (staff surface)"

  accessibility_acceptance:   # FULL pass (Scott-approved 2026-06-28); run against the RUNNING installed UI, not unit asserts
    - "Keyboard-only: full traversal + form submission on /civicaccess and /civicaccess/staff with no mouse; skip-link works; focus order is logical; :focus-visible is present."
    - "Screen-reader / ARIA: landmarks, programmatic name/role/value, labelled inputs, and aria-live announcement of review results verified on the rendered pages."
    - "WCAG 2.1 AA: contrast (1.4.3) and visible focus (2.4.7) checked on the actual rendered surfaces (NOT the in-app 4-rule content linter)."
    - "Export correctness: a persisted review -> records-export round-trip; OPEN the produced artifact and validate the declared format; for tagged-PDF verify real tag structure / heading reading-order / alt-text presence and source->rewrite provenance fidelity."
    - "Staff boundary: persistence-write routes reject requests without a valid X-CivicAccess-Write-Token (Phase A guard) on the installed stack."

  expected_outputs:
    - "Evidence kit committed with the release tag: clean-VM install (double-click, no terminal), all 14 surfaces exercised in-browser with screenshots/recordings + the persisted Postgres DB, reboot-survival proof, and the full accessibility_acceptance artifacts."
    - "STATUS.md + CHANGELOG.md updated to the proven 6-module city-core truth."
    - "If any DoD/accessibility item FAILS: do NOT claim done; record the failure, and the fix loops back to Phase A/B (revert Phase C if it must stay out)."

  required_gates:
    - clean_vm_dod_passed       # the program DoD - clean VM, double-click, workflows in browser, reboot survives, evidence kit
    - accessibility_passed      # the full a11y + export-correctness acceptance above
    - human_approval_merge

  risk: medium

  rollback_plan: >
    Proof phase - no product change to roll back. If the DoD or accessibility acceptance fails,
    civicaccess does not earn city-core membership: loop the fix back to Phase A/B and, if needed,
    revert the Phase C flip so city-core returns to the 5-module proven state. No half-claims.

  definition_of_done: >
    The 6-module city-core has a committed clean-VM evidence kit showing double-click install, every
    CivicAccess workflow exercised end-to-end in the browser with Postgres-persisted data surviving a
    reboot, and a full accessibility + export-correctness acceptance pass. Only this kit - not CI -
    constitutes done, per the full-suite program.

  director_notes:
    - "executor: the Beelink tester is gone; stand up the clean-VM harness first (Windows Sandbox QA-B1 pattern is proven on this org). Use fire-and-forget invoke + external poll for long ops (model is N/A here - CivicAccess has no model - but install/health/backup are still long)."
    - "critic: reject any 'done' that rests on a green CI run or passing pytest - the program DoD requires the clean-VM kit. Reject an export-correctness check that only inspects the checklist string instead of the produced artifact."
